name: Feature request
description: Suggest something Ognom should do
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The task or problem, in your own words. What's slow, missing or awkward today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: How you imagine it working. Rough is fine.
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead?
      description: Workarounds, other tools, mongosh scripts.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Connections / SSH
        - Querying
        - Documents and editing
        - Aggregation
        - Schema / interface builder
        - Indexes
        - Import, export, copy, diff
        - Shell
        - Server and operations
        - Look and feel
        - Other
